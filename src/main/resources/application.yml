
server:
  port: 8081

spring:
  application:
    name: ms-reservation-inventory

  graphql:
    graphiql:
      enabled: true

  profiles:
    active: dev

  threads:
    virtual:
      enabled: true

mq:
  queues:
    reservationInventory: ms-reservation-inventory

featuretoggle:
  EnvName: ${FEATURE_TOGGLE_NAME}
  InstanceId: ${INSTANCE_ID}
  Url: ${FEATURE_TOGGLE_URL}